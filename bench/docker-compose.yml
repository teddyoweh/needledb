# The Docker side of the benchmark: NeedleDB, Qdrant and pgvector in the same VM,
# with the same CPU and memory limits (sized for an 8 GB Docker Desktop VM).
#
#   docker compose -f bench/docker-compose.yml up -d --build
#   python -m bench.run --dataset dbpedia-1536 --systems needledb-docker,qdrant-docker,pgvector-docker
name: needledb-bench

x-limits: &limits
  cpus: 8
  mem_limit: 7g

services:
  needledb:
    <<: *limits
    build:
      context: ..
    image: needledb:bench
    container_name: needledb-bench-needledb
    ports:
      - "8081:8080"
    environment:
      NEEDLEDB_API_KEY: bench
    volumes:
      - needledb-bench:/data

  qdrant:
    <<: *limits
    image: qdrant/qdrant:latest
    container_name: needledb-bench-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant-bench:/qdrant/storage

  pgvector:
    <<: *limits
    image: pgvector/pgvector:pg17
    container_name: needledb-bench-pgvector
    shm_size: 4g
    ports:
      - "5433:5432"
    environment:
      POSTGRES_PASSWORD: bench
      POSTGRES_DB: bench
    command: ["postgres", "-c", "shared_buffers=2GB", "-c", "effective_cache_size=5GB",
              "-c", "maintenance_work_mem=3GB", "-c", "max_parallel_maintenance_workers=7",
              "-c", "max_parallel_workers=8", "-c", "work_mem=64MB", "-c", "synchronous_commit=off"]
    volumes:
      - pgvector-bench:/var/lib/postgresql/data

volumes:
  needledb-bench:
  qdrant-bench:
  pgvector-bench:
