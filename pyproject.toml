[project]
name = "needledb"
version = "0.1.0"
description = "A self-hostable vector database with a Pinecone-shaped API, built on FAISS."
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "faiss-cpu>=1.9",
    "numpy>=1.26",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "httpx>=0.27",
    "orjson>=3.10",
]

[project.optional-dependencies]
dev = ["pytest>=8", "psutil>=5.9", "pinecone>=5"]
bench = ["psutil>=5.9", "qdrant-client>=1.9", "psycopg[binary]>=3.2", "pgvector>=0.3", "pyarrow>=15", "matplotlib>=3.8"]

[project.scripts]
needledb = "needledb.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["needledb"]
# The built dashboard is git-ignored, so name it explicitly or hatch leaves it out.
artifacts = ["needledb/server/static/**"]

[tool.pytest.ini_options]
testpaths = ["tests"]
