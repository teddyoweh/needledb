[project]
name = "needledb"
version = "0.1.0"
description = "A self-hostable vector database with a Pinecone-shaped API, built on FAISS."
readme = "README.md"
requires-python = ">=3.11,<3.15"
authors = [{ name = "Teddy Oweh" }]
keywords = ["vector database", "faiss", "hnsw", "embeddings", "similarity search", "pinecone", "rag"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Framework :: FastAPI",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Database :: Database Engines/Servers",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
# Every runtime import is a direct dependency, bounded below by the oldest version
# tested and above by the next major, so a new release upstream can't break installs.
dependencies = [
    "faiss-cpu>=1.9,<2",
    "numpy>=1.26,<3",
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "pydantic>=2.7,<3",
    "anyio>=4.4,<5",
    "httpx>=0.27,<1",
    "orjson>=3.10,<4",
    "psutil>=5.9,<8",
]

[project.optional-dependencies]
# Local embedding models (BGE, MiniLM, Nomic, E5 …) running on the server's CPU.
local = ["fastembed>=0.5,<1"]
dev = ["pytest>=8", "pinecone>=5"]
bench = ["qdrant-client>=1.9", "psycopg[binary]>=3.2", "pgvector>=0.3", "pyarrow>=15", "matplotlib>=3.8"]

[project.scripts]
needledb = "needledb.cli:main"

[project.urls]
Homepage = "https://github.com/teddyoweh/needledb"
Documentation = "https://github.com/teddyoweh/needledb#readme"
Repository = "https://github.com/teddyoweh/needledb"
Issues = "https://github.com/teddyoweh/needledb/issues"
Changelog = "https://github.com/teddyoweh/needledb/releases"

[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

# Builds the web app into needledb/server/static when it's missing (see hatch_build.py).
[tool.hatch.build.hooks.custom]
path = "hatch_build.py"

[tool.hatch.build.targets.wheel]
packages = ["needledb"]
# The built web app is git-ignored, so name it explicitly or hatch leaves it out.
artifacts = ["needledb/server/static/**"]

[tool.hatch.build.targets.sdist]
include = ["needledb", "ui", "tests", "hatch_build.py", "README.md", "pyproject.toml"]
exclude = ["ui/node_modules", "ui/dist", "**/__pycache__"]
artifacts = ["needledb/server/static/**"]

[tool.pytest.ini_options]
testpaths = ["tests"]
